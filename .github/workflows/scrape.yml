name: 🔄 Scrape Proxies

on:
  schedule:
    - cron: '*/5 * * * *'  # Every 5 minutes
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: 🔍 Run Proxy Scraper
        run: |
          python scripts/scraper.py

      - name: 📊 Get current stats
        id: stats
        run: |
          HTTP=$(wc -l < http.txt 2>/dev/null || echo 0)
          HTTPS=$(wc -l < https.txt 2>/dev/null || echo 0)
          SOCKS4=$(wc -l < socks4.txt 2>/dev/null || echo 0)
          SOCKS5=$(wc -l < socks5.txt 2>/dev/null || echo 0)
          echo "http=$HTTP" >> $GITHUB_OUTPUT
          echo "https=$HTTPS" >> $GITHUB_OUTPUT
          echo "socks4=$SOCKS4" >> $GITHUB_OUTPUT
          echo "socks5=$SOCKS5" >> $GITHUB_OUTPUT

      - name: 📤 Commit and push changes
        run: |
          git config --local user.email "proxy-bot@github.com"
          git config --local user.name "🔄 Proxy Bot"
          git add -A
          git diff --staged --quiet || git commit -m "🔄 Auto-scrape: $(date -u '+%Y-%m-%d %H:%M UTC') | HTTP:${{ steps.stats.outputs.http }} HTTPS:${{ steps.stats.outputs.https }} SOCKS4:${{ steps.stats.outputs.socks4 }} SOCKS5:${{ steps.stats.outputs.socks5 }}"
          git push
